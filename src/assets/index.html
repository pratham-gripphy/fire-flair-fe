/* XP ladder — each rung names the tier metal it unlocks, so the reward badge
   is always drawn from the same Coin/FFEmblem art used everywhere else in
   the card system, never a separate gamification graphic. Extensible: add a
   rung here and the XP bar, profile badge and level-up state all follow. */
/* XP ladder. Bronze and Silver are fixed thresholds; Gold is NOT a number —
   it's awarded to the current quarter's top performers, so it can never be
   invented as a fixed XP figure. xpProgress() treats Gold as "reached" only
   when the caller says so (goldEligible), never from the xp value alone. */
const XP_LEVELS = [
  { tier: "bronze", xp: 100, label: "Bronze", unlocks: "First level of profile customisation" },
  { tier: "silver", xp: 500, label: "Silver", unlocks: "Additional profile customisation" },
  { tier: "gold",   xp: null, label: "Gold",   unlocks: "Premium profile customisation", earnedBy: "quarter-top-performers" },
];
const XP_NUMERIC_LEVELS = XP_LEVELS.filter(l => typeof l.xp === "number");

/* ==========================================================================
   XP PERIODS — professional quarterly structure.
   One generator, not months hand-written across the UI: give it a start
   quarter and a count, and it produces the sequence with each quarter's
   months derived from its number. Extending the beta into more quarters is
   a config change here, not a UI change.
   ========================================================================== */
const QUARTER_MONTHS = [
  ["January", "February", "March"], ["April", "May", "June"],
  ["July", "August", "September"], ["October", "November", "December"],
];

function quarterAfter(year, q) { return q === 4 ? { year: year + 1, q: 1 } : { year, q: q + 1 }; }
function quarterLabel(p) { return `${p.year} Q${p.q}`; }
function quarterMonths(p) { return QUARTER_MONTHS[p.q - 1]; }

function generateQuarters(startYear, startQ, count) {
  const out = [];
  let cur = { year: startYear, q: startQ };
  for (let i = 0; i < count; i++) { out.push(cur); cur = quarterAfter(cur.year, cur.q); }
  return out;
}

/* The single source of truth for "what quarter is it": change these two
   numbers and the whole XP Beta timeline, labels and reset behaviour move
   with it — nothing else in the app hardcodes a quarter. */
const XP_BETA_START = { year: 2026, q: 4 };
const XP_CURRENT_PERIOD = { year: 2026, q: 4 };
const XP_TIMELINE = generateQuarters(XP_BETA_START.year, XP_BETA_START.q, 5);
const xpPeriodKey = (p) => `${p.year}Q${p.q}`;

function xpProgress(xp) {
  const cur = xp || 0;
  const next = XP_NUMERIC_LEVELS.find(l => cur < l.xp);
  const prevXp = (() => {
    const i = next ? XP_NUMERIC_LEVELS.indexOf(next) : XP_NUMERIC_LEVELS.length;
    return i > 0 ? XP_NUMERIC_LEVELS[i - 1].xp : 0;
  })();
  const reached = XP_NUMERIC_LEVELS.filter(l => cur >= l.xp);
  const currentTier = reached.length ? reached[reached.length - 1].tier : "standard";
  if (!next) return { xp: cur, next: null, pct: 100, currentTier, prevXp, nextXp: cur || 1 };
  const span = next.xp - prevXp;
  const pct = span > 0 ? Math.min(100, Math.max(0, ((cur - prevXp) / span) * 100)) : 0;
  return { xp: cur, next, pct, currentTier, prevXp, nextXp: next.xp };
}

    + `<path d='M12 160 C16 118 42 100 64 94 L80 104 L96 94 C118 100 144 118 148 160 Z' fill='url(#gm)'/>`
    + `<path d='M70 78 h20 v24 l-10 7 -10 -7 Z' fill='url(#sk)' fill-opacity='.9'/>`
    + `<path d='M64 94 L80 106 L96 94 L96 104 L80 118 L64 104 Z' fill='#EFEAE0' fill-opacity='.9'/>`

function Sheet({ open, onClose, title, children }) {

    return () => window.removeEventListener("keydown", k);

      </div>

  );

const CARD_CATEGORIES = ["professions", "skills", "interests", "locations", "languages"];

/* Merge built-in categories with any the user has added at runtime. */
const allCategories = (profile) => ({ ...BASE_CATEGORIES, ...(profile.categories || {}) });
const categoryDef = (profile, key) => allCategories(profile)[key] || { label: key, singular: key, icon: "skills", fields: ["description", "media"] };
const categoryOrder = (profile) => Object.keys(allCategories(profile));
const catHas = (def, field) => (def.fields || []).includes(field);

const makeRecord = (category, name, extra = {}) => ({
  id: uid("rec"),
  category,
  name: String(name || "").trim(),
  description: "",
  media: [],          // [{ id, name, dataUrl }]
  document: null,     // { name, size, type, dataUrl }
  proficiency: "",
  primary: false,
  proposed: false,    // true while awaiting user review (CV adapter)
  source: { origin: "manual", location: null, confidence: "confirmed" },
  ...extra,
});

const recsOf = (profile, cat) => (profile.records && profile.records[cat]) || [];

/* The Profile Card reads primaries. If nothing is flagged primary we fall
   back to the first few, so a fresh profile still renders a usable card. */
function primaryNames(profile, cat, limit) {
  const all = recsOf(profile, cat);
  const flagged = all.filter(r => r.primary && !r.proposed);
  const live = all.filter(r => !r.proposed);
  return (flagged.length ? flagged : live).slice(0, limit).map(r => r.name).filter(Boolean);
}

const emptyRecords = () => Object.keys(BASE_CATEGORIES).reduce((m, k) => { m[k] = []; return m; }, {});

/* Read-only records synthesised for directory people, so that opening
   someone else's profile uses the same Information Card components. */
/* Reviews written ABOUT a person, newest first, shaped as records so they
   render through the same Information Card as everything else. */
function reviewRecordsFor(state, personId) {
  return (state.reviews || [])
    .filter(r => r.aboutId === personId)
    .sort((a, b) => b.at - a.at)
    .map(r => ({
      ...makeRecord("reviews", `${r.rating}★ from ${r.byName}`),
      id: r.id, description: r.text, rating: r.rating, primary: true, readOnly: true,
    }));
}

function recordsForPerson(state, person) {
  if (person.id === "me") return { ...state.profile.records, reviews: reviewRecordsFor(state, "me") };
  const mk = (cat, arr) => (arr || []).filter(Boolean).map(n => ({
    ...makeRecord(cat, n), id: `${person.id}_${cat}_${String(n).replace(/\W+/g, "")}`,
    primary: true, readOnly: true,
  }));
  return {
    professions: mk("professions", [person.profession]),
    skills: mk("skills", person.skills),
    interests: mk("interests", person.interests),
    locations: mk("locations", person.locations),
    languages: mk("languages", person.languages),
    qualifications: [], reviews: reviewRecordsFor(state, person.id), experience: [],
  };
}

};

  [...items].sort((a, b) => String(a.iso || "9").localeCompare(String(b.iso || "9")))

}

const withRecords = (s, cat, list) => ({
  ...s, profile: { ...s.profile, records: { ...s.profile.records, [cat]: list } },
});

/* Claim a task once. Re-claiming is a no-op, so XP can never be farmed by
   repeating the same action. Every award lands in xpLog for Core to read. */
/* Quarter rollover — if the profile's stored xpPeriodKey no longer matches
   the live current quarter, archive that period's final total into history
   and start the new quarter at 0. All-time xp/xpLog are untouched: this
   only ever resets the CURRENT-period counter. */
function rollXPPeriodIfNeeded(profile) {
  const liveKey = xpPeriodKey(XP_CURRENT_PERIOD);
  if (profile.xpPeriodKey === liveKey) return profile;
  const closed = { period: profile.xpPeriodKey, xp: profile.xpPeriod || 0 };
  return {
    ...profile,
    xpPeriod: 0,
    xpPeriodKey: liveKey,
    xpHistory: [...(profile.xpHistory || []), closed],
  };
}

function claimXP(s, taskId, amount) {
  const claimed = s.profile.xpClaimed || [];
  if (claimed.includes(taskId)) return s;
  const xp = amount === undefined ? XP_VALUES.task : amount;
  return {
    ...s,
    profile: {
      ...s.profile,
      xp: (s.profile.xp || 0) + xp,
      xpPeriod: (s.profile.xpPeriod || 0) + xp,
      xpClaimed: [...claimed, taskId],
      xpLog: [...(s.profile.xpLog || []), { id: taskId, xp, at: Date.now() }],
    },
  };
}

function reducer(s, a) {
  switch (a.type) {
    case "ROLE":      return { ...s, viewing: null, role: a.role, tab: "home", route: a.role === "team" ? (s.profile.live ? "live" : "entry") : "staffHome" };
    case "GO":        return { ...s, route: a.route };
    case "TAB":       return { ...s, viewing: null, tab: a.tab, route: a.route ?? s.route };
    case "SESSION":   return { ...s, session: { ...s.session, ...a.patch } };
    case "PROFILE":   return { ...s, profile: { ...s.profile, ...a.patch } };

    case "REC_ADD":   return claimXP(withRecords(s, a.category, [...recsOf(s.profile, a.category), a.record]), xpTaskFor(a.category));
    case "REC_PATCH":
      return withRecords(s, a.category, recsOf(s.profile, a.category).map(r => r.id === a.id ? { ...r, ...a.patch } : r));
    case "REC_DELETE":
      return withRecords(s, a.category, recsOf(s.profile, a.category).filter(r => r.id !== a.id));
    case "REC_PRIMARY": {
      const def = categoryDef(s.profile, a.category);
      const limit = def.cardLimit || 3;
      const list = recsOf(s.profile, a.category);
      const current = list.filter(r => r.primary).length;
      if (a.primary && current >= limit) return { ...s, toast: `Your card shows ${limit} ${def.label.toLowerCase()} at a time. Unpick one first.` };
      return withRecords(s, a.category, list.map(r => r.id === a.id ? { ...r, primary: a.primary } : r));
    }
    case "REC_ACCEPT":
      return withRecords(s, a.category, recsOf(s.profile, a.category).map(r => r.id === a.id ? { ...r, proposed: false } : r));
    case "REC_BULK":  return withRecords(s, a.category, a.list);
    case "RECORDS_MERGE": {
      const next = { ...s.profile.records };
      Object.entries(a.byCategory).forEach(([cat, list]) => { next[cat] = [...(next[cat] || []), ...list]; });
      return { ...s, profile: { ...s.profile, records: next } };
    }
    case "CATEGORY_ADD": {
      const key = a.key;
      if (allCategories(s.profile)[key]) return { ...s, toast: "That category already exists." };
      return {
        ...s, profile: {
          ...s.profile,
          categories: { ...(s.profile.categories || {}), [key]: a.def },
          records: { ...s.profile.records, [key]: [] },
        },
        toast: `${a.def.label} added as a category`,
      };
    }

    case "SELECT": {
      const on = s.selection.includes(a.id);
      return { ...s, selection: on ? s.selection.filter(x => x !== a.id) : [...s.selection, a.id] };
    }
    case "CLEAR_SELECTION": return { ...s, selection: [] };
    case "TOGGLE_CATEGORY":
      return { ...s, categoryVisibility: { ...s.categoryVisibility, [a.key]: a.visible ?? !(s.categoryVisibility[a.key] !== false) } };
    case "MEDIA_ADD":    return { ...s, profile: { ...s.profile, media: [...(s.profile.media || []), a.item] } };
    case "MEDIA_DELETE": return { ...s, profile: { ...s.profile, media: (s.profile.media || []).filter(m => m.id !== a.id) } };

    case "EVENT_ADD":  return { ...s, events: [...s.events, a.event] };
    case "SHIFT_ADD":  return { ...s, shifts: [...s.shifts, a.shift] };
    case "REQUESTS": {
      const made = a.staffIds.map(sid => ({
        id: uid("eng"), shiftId: a.shiftId, staffId: sid,
        state: "requested", history: [{ state: "requested", at: Date.now() }],
      }));
      return { ...s, engagements: [...s.engagements, ...made], selection: [] };
    }
    case "ENG_STATE":
      return {
        ...s, engagements: s.engagements.map(e => e.id === a.id
          ? { ...e, state: a.state, history: [...e.history, { state: a.state, at: Date.now() }] } : e)
      };

    case "PUBLISH_XP": return claimXP(s, "publish_profile");
    case "CARD_CREATED_XP": return claimXP(s, "create_card");
    case "ANSWER": {
      const prev = s.profile.answers || {};
      const first = prev[a.qid] === undefined || prev[a.qid] === "";
      const patch = { answers: { ...prev, [a.qid]: a.value } };
      /* The car question is the source of truth for the old hasCar flag, so
         the card glyph still works without a standalone Has Car control. */
      if (a.qid === "q_car") patch.hasCar = a.value === "Yes";
      const next = { ...s, profile: { ...s.profile, ...patch } };
      /* +1 XP the first time a question is answered, never on edits. */
      return first ? claimXP(next, `question_${a.qid}`, XP_VALUES.question) : next;
    }
    case "CONNECT":   return { ...s, connections: [...s.connections, ...a.people] };
    case "REVIEW_ADD": {
      const next = { ...s, reviews: [...s.reviews, a.review] };
      return a.review.aboutId === "me" ? claimXP(next, "first_review") : next;
    }
    case "REVIEW_REQUEST": return { ...s, reviewRequests: [...s.reviewRequests, a.request] };
    case "INVITE":    return { ...s, invitations: [...s.invitations, ...a.people] };
    case "VIEW":      return { ...s, viewing: a.id };
    case "SEED_DEMO": return {
      ...s, role: "team", tab: "home", route: "home", viewing: null,
      session: { ...s.session, tag: "SAM42", phone: "+44 7700 900412", verified: true },

    case "HYDRATE":   return { ...s, ...a.patch, _hydrated: true };
    default:          return s;

}

   place the rest of the app touches extraction. Swap its body for a real
   Core API call and nothing above it changes.

   HONEST STATUS: no extraction service is wired up in this prototype. The
   adapter reports `available: false` and the UI says so plainly rather than
   pretending a CV was read. The review/accept/reject data flow below is real
   and is what a live adapter would feed.
   ========================================================================== */

const CV_ADAPTER = {
  available: false,
  note: "CV reading is not connected in this prototype. The review flow below is the one a live extraction service would feed.",

  /* Contract a live adapter must satisfy:
     -> { name, professions[], skills[], interests[], locations[],
          languages[], qualifications[], experience[] }
        where each item is { value, description?, source, confidence }.
     Nothing is invented; anything not evidenced in the document is omitted. */
  async extract(file) {
    await new Promise(r => setTimeout(r, 700));
    const err = new Error(CV_ADAPTER.note);
    err.notConnected = true;

/* ==========================================================================
   PROFILE AI — free text -> proposed Question Card answers.
   No language model is wired up: this is a keyword/phrase matcher against
   the QUESTIONS library, honestly labelled as such. A live adapter would
   swap this function's body for a real model call and keep the same
   { qid, value, matchedOn } output shape, so nothing downstream changes.
   The caller is always responsible for confirming proposals before they
   touch the profile — this function only ever proposes, never writes.
   ========================================================================== */
function proposeAnswersFromText(text) {
  const t = (text || "").toLowerCase();
  const proposals = [];
  const yes = (qid, phrases, invertPhrases) => {
    if (invertPhrases && invertPhrases.some(p => t.includes(p))) { proposals.push({ qid, value: "No" }); return; }
    if (phrases.some(p => t.includes(p))) proposals.push({ qid, value: "Yes" });
  };

  yes("q_car", ["own car", "have a car", "my car", "drive myself"]);
  yes("q_licence", ["driving licence", "driver's licence", "driving license"]);
  yes("q_kit", ["own equipment", "own kit", "cocktail equipment", "bar equipment"]);
  yes("q_shaker", ["own shaker", "cocktail shaker"]);
  yes("q_tools", ["own bar tools", "own tools"]);
  yes("q_insurance", ["insurance", "insured"]);
  yes("q_weekend", ["weekends", "weekend events", "weekend work"]);
  yes("q_evening", ["evenings", "evening events", "evening work"]);
  yes("q_lastmin", ["last minute", "last-minute", "short notice"]);
  yes("q_weddings", ["wedding"]);
  yes("q_corporate", ["corporate event", "corporate work", "corporate booking"]);
  yes("q_private", ["private part", "private event"]);
  yes("q_festivals", ["festival"]);

  const travel = t.match(/(\d+)\s*mile/);
  if (travel) {
    const miles = Number(travel[1]);
    const opt = miles <= 10 ? "Up to 10 miles" : miles <= 25 ? "Up to 25 miles" : miles <= 50 ? "Up to 50 miles" : "Anywhere";
    proposals.push({ qid: "q_travel", value: opt });
  }

  const locMatch = t.match(/based in ([a-z\s]+?)(?:[.,]|$)/);
  if (locMatch) proposals.push({ qid: "q_2027", value: `Based in ${locMatch[1].trim()}` });

  const yearsMatch = t.match(/(\d+)\s*years?/);
  if (yearsMatch && (t.includes("wedding") || t.includes("corporate") || t.includes("experience"))) {
    proposals.push({ qid: "q_goal", value: `${yearsMatch[1]} years' experience in events` });
  }

  // De-duplicate by qid, keep first match.
  const seen = new Set();
  return proposals.filter(p => { if (seen.has(p.qid)) return false; seen.add(p.qid); return true; });
}

/* Extraction result -> proposed records, flagged `proposed` so nothing
   reaches the profile until the user accepts it. */
function recordsFromExtraction(x) {
  const byCategory = {};
  const src = (o) => ({ origin: "CV", location: o?.source || "document", confidence: o?.confidence || "medium" });
  const many = (cat, arr) => {
    const list = (arr || []).filter(i => i && i.value);
    if (!list.length) return;
    byCategory[cat] = list.map(i => ({
      ...makeRecord(cat, i.value),
      description: i.description || "",
      proposed: true,
      source: src(i),
    }));
  };
  many("professions", x.professions);
  many("skills", x.skills);
  many("interests", x.interests);
  many("locations", x.locations);
  many("languages", x.languages);
  many("qualifications", x.qualifications);
  many("experience", x.experience);
  return byCategory;
}

/* ---- media helpers ------------------------------------------------------
   Files are held as data URLs so they survive a reload alongside the rest of
   the saved profile. Kept modest on purpose — this is prototype storage. */
const MAX_MEDIA_BYTES = 1.6 * 1024 * 1024;

function readFileAsDataUrl(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result));
    r.onerror = () => rej(new Error("Could not read that file."));
    r.readAsDataURL(file);
  });
}

const prettyBytes = (n) => n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`;

        <div style={{ margin: "0 -16px", display: "grid", gridTemplateColumns: "1fr 1fr 1fr" }}>

/* ==========================================================================
   INFORMATION CARD EDITOR
   Opens the full record behind a Profile Card entry. Renders only the fields
   the category declares, so qualifications get documents, languages get
   proficiency, and nothing carries fields it has no use for.
   ========================================================================== */
/* ==========================================================================
   REVIEW SHEET
   Written about a connection, stored centrally against their id, and surfaced
   on their profile as a Review information record.
   ========================================================================== */
/* Add-to-Apple-Wallet button — same shape wherever it appears, on a profile
   card or a booking card. Honest about the adapter status rather than
   pretending a pass downloads. */
/* ==========================================================================
   FFAI — one shared chat-style entry point.
   Reused wherever the app needs "tell us what you're looking for": FF Staff
   today, FF Team/FF Party/FF VIP later. It wraps the EXISTING search logic
   (directory filtering by name/skill/area) rather than replacing it, and
   offers the existing event/shift creation as quick actions for anyone who'd
   rather describe a booking than search. No real language model is wired up
   here — a typed line either matches people directly (search) or is handed
   to the person as a prompt to create an event/shift card, honestly, same
   pattern as the CV and Wallet adapters elsewhere in the app.
   ========================================================================== */
function FFAI({ query, onQuery, onEvent, onShift, placeholder, context = "FireFlair" }) {
  const [val, setVal] = useState(query || "");
  useEffect(() => setVal(query || ""), [query]);
  const looksLikeBooking = /\b(need|looking for|wedding|event|shift|hire|staff|party|corporate)\b/i.test(val) && val.trim().split(/\s+/).length > 3;

  const submit = () => {
    const v = val.trim();
    if (!v) return;
    onQuery(v);
  };

  return (
    <div className="ff-frame ff-lattice" style={{ padding: 14, margin: "14px 0" }}>
      <Corners />
      <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 10 }}>
        <Coin size={30} tier="gold" />
        <span style={{ minWidth: 0 }}>
          <span className="ff-display" style={{ fontSize: 13, display: "block" }}>Welcome to {context}</span>
          <span className="ff-body ff-muted" style={{ fontSize: 12 }}>Tell us what you're looking for.</span>
        </span>
      </div>
      <div style={{ position: "relative" }}>
        <Search size={16} color="#A9A296" style={{ position: "absolute", left: 12, top: 15 }} />
        <input className="ff-input" style={{ paddingLeft: 36, paddingRight: val ? 84 : 14 }}
          placeholder={placeholder || "Name, skill, area, or describe your event…"}
          value={val} onChange={(e) => { setVal(e.target.value); onQuery(e.target.value); }}
          onKeyDown={(e) => e.key === "Enter" && submit()} />
        {val && (
          <button onClick={submit} className="ff-btn sm primary" style={{ position: "absolute", right: 5, top: 6, padding: "7px 10px" }}>Go</button>
        )}
      </div>
      {looksLikeBooking && (onEvent || onShift) && (
        <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap", alignItems: "center" }}>
          <span className="ff-body ff-muted" style={{ fontSize: 11.5 }}>Sounds like a booking —</span>
          {onEvent && <Btn variant="sm" onClick={onEvent}><Calendar size={12} /> Create event</Btn>}
          {onShift && <Btn variant="sm" onClick={onShift}><Clock size={12} /> Create shift</Btn>}
        </div>
      )}
      {!val && (onEvent || onShift) && (
        <div style={{ display: "grid", gridTemplateColumns: onEvent && onShift ? "1fr 1fr" : "1fr", gap: 8, marginTop: 12 }}>
          {onEvent && <Btn variant="primary" onClick={onEvent}><Calendar size={14} /> Tell us about an event</Btn>}
          {onShift && <Btn onClick={onShift}><Clock size={14} /> Describe a shift</Btn>}
        </div>
      )}
    </div>
  );
}

function QuestionSheet({ open, q, onClose }) {
  const { state, dispatch } = useStore();
  const [val, setVal] = useState("");
  useEffect(() => { if (open && q) setVal(state.profile.answers?.[q.id] ?? ""); }, [open, q && q.id]);
  if (!open || !q) return null;
  const existing = state.profile.answers?.[q.id];
  const isNew = existing === undefined || existing === "";

  const save = (v) => {
    dispatch({ type: "ANSWER", qid: q.id, value: v });
    dispatch({ type: "TOAST", toast: isNew ? `Answered · +${q.xp} XP` : "Answer updated" });
    onClose();
  };

  return (
    <Sheet open onClose={onClose} title="Question">
      <p className="ff-serif" style={{ fontSize: 19, lineHeight: 1.35, marginTop: 0 }}>{q.text}</p>
      {q.type === "yesno" && (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          <Btn variant={existing === "Yes" ? "primary" : ""} onClick={() => save("Yes")}>Yes</Btn>
          <Btn variant={existing === "No" ? "primary" : ""} onClick={() => save("No")}>No</Btn>
        </div>
      )}
      {q.type === "choice" && (
        <div style={{ display: "grid", gap: 8 }}>
          {q.options.map(o => (
            <Btn key={o} variant={existing === o ? "primary" : ""} onClick={() => save(o)}>{o}</Btn>
          ))}
        </div>
      )}
      {q.type === "text" && (<>
        <Field label="Your answer">
          <textarea className="ff-input" rows={3} value={val} onChange={(e) => setVal(e.target.value)} placeholder={q.placeholder || ""} />
        </Field>
        <Btn variant="primary wide" disabled={!val.trim()} onClick={() => save(val.trim())}>
          {isNew ? `Save · +${q.xp} XP` : "Save answer"}
        </Btn>
      </>)}
      <p className="ff-body ff-muted" style={{ fontSize: 11.5, marginTop: 14, marginBottom: 0 }}>
        Answers help FireFlair understand your work and match you to opportunities. They don't appear on your public card.
      </p>
    </Sheet>
  );
}

/* A group of Question Cards — used for logistics, availability, experience,
   and for the dream-opportunity questions that become Job Request data. */
/* ONE unified Question Cards carousel — every category's questions in a
   single left/right swipeable collection, each card carrying its own
   category name and colour so the category stays legible while swiping. */
function QuestionCardsCollection() {

      </p>

/* Share Card — FF Team's Add FireFlair action. Enter a number, send the
   card. Deliberately simple: no new send infrastructure, just the flow the
   spec asks for, using the existing tag/session data already on the card. */
/* Media — photos and videos on the profile itself, not tucked inside one
   skill. Photos are stored as data URLs, same as everywhere else media is
   handled in this prototype; video is a linked URL rather than an uploaded
   file, since a video blob would blow the size budget this app works within. */
/* ==========================================================================
   AI PROFILE COMPLETION — reuses the FFAI visual language, purpose-built to
   feed the Question Cards. Text, pasted CV, or (where the browser supports
   it) speech all funnel into proposeAnswersFromText(), and every proposal
   sits unconfirmed until the person picks it — the existing ANSWER action
   and its claim-once XP protection is the only thing that ever writes to
   the profile, so nothing here bypasses that.
   ========================================================================== */
function AIProfileCompletion() {
  const { state, dispatch } = useStore();
  const [text, setText] = useState("");
  const [proposals, setProposals] = useState(null);
  const [picked, setPicked] = useState({});
  const [listening, setListening] = useState(false);
  const recogRef = useRef(null);

  const questionFor = (qid) => QUESTIONS.find(q => q.id === qid);
  const already = (qid) => { const a = state.profile.answers?.[qid]; return a !== undefined && a !== ""; };

  const process = () => {
    const found = proposeAnswersFromText(text).filter(p => !already(p.qid));
    setProposals(found);
    setPicked(Object.fromEntries(found.map(p => [p.qid, true])));
  };

  const confirm = () => {
    const chosen = proposals.filter(p => picked[p.qid]);
    chosen.forEach(p => dispatch({ type: "ANSWER", qid: p.qid, value: p.value }));
    dispatch({ type: "TOAST", toast: `${chosen.length} question${chosen.length === 1 ? "" : "s"} answered · +${chosen.length * XP_VALUES.question} XP` });
    setProposals(null); setText(""); setPicked({});
  };

  const toggleMic = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { dispatch({ type: "TOAST", toast: "Voice input isn't available in this browser." }); return; }
    if (listening) { recogRef.current?.stop(); return; }
    const r = new SR();
    r.lang = "en-GB"; r.interimResults = false; r.continuous = false;
    r.onresult = (e) => setText(x => (x ? x + " " : "") + e.results[0][0].transcript);
    r.onend = () => setListening(false);
    r.onerror = () => setListening(false);
    recogRef.current = r; r.start(); setListening(true);
  };

  return (
    <div className="ff-frame ff-lattice" style={{ padding: 14, margin: "16px 0" }}>
      <Corners />
      <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 10 }}>
        <Coin size={30} tier="gold" />
        <span style={{ minWidth: 0 }}>
          <span className="ff-display" style={{ fontSize: 13, display: "block" }}>Welcome to FireFlair</span>
          <span className="ff-body ff-muted" style={{ fontSize: 12 }}>
            Answer your questions with AI — type, speak, or paste your CV.
          </span>
        </span>
      </div>

      {proposals === null ? (<>
        <div style={{ position: "relative" }}>
          <textarea className="ff-input" rows={4} style={{ paddingRight: 44 }}
            placeholder="Tell us about yourself — your experience, kit, availability, where you're based…"
            value={text} onChange={(e) => setText(e.target.value)} />
          <button onClick={toggleMic} aria-label={listening ? "Stop listening" : "Answer by voice"}
            style={{ position: "absolute", right: 8, top: 8, color: listening ? "var(--bad)" : "var(--gold-dk)", padding: 4 }}>
            <Mic size={18} />
          </button>
        </div>
        <Btn variant="primary wide" disabled={!text.trim()} onClick={process} style={{ marginTop: 10 }}>
          <Award size={14} /> Find my answers
        </Btn>
        <p className="ff-body ff-muted" style={{ fontSize: 11, marginTop: 8, marginBottom: 0 }}>
          This can use the info to fill in your Question Cards — you confirm before anything is saved.
        </p>
      </>) : proposals.length === 0 ? (
        <div>
          <p className="ff-body" style={{ margin: "0 0 10px" }}>Nothing new in there — try adding a bit more detail, or answer the cards directly below.</p>
          <Btn variant="ghost wide" onClick={() => setProposals(null)}>Try again</Btn>
        </div>
      ) : (
        <div>
          <p className="ff-body" style={{ margin: "0 0 10px" }}>Found {proposals.length} answer{proposals.length === 1 ? "" : "s"} — pick which to confirm.</p>
          {proposals.map(p => {
            const q = questionFor(p.qid);
            if (!q) return null;
            return (
              <label key={p.qid} className="ff-frame" style={{ padding: 11, marginBottom: 8, display: "flex", gap: 11, alignItems: "flex-start", cursor: "pointer" }}>
                <input type="checkbox" checked={!!picked[p.qid]} style={{ marginTop: 3 }}
                  onChange={(e) => setPicked(x => ({ ...x, [p.qid]: e.target.checked }))} />
                <span>
                  <span className="ff-serif" style={{ fontSize: 14, display: "block" }}>{q.text}</span>
                  <span className="ff-body ff-muted" style={{ fontSize: 12 }}>Proposed: <b>{p.value}</b></span>
                </span>
              </label>
            );
          })}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 4 }}>
            <Btn variant="primary" disabled={!Object.values(picked).some(Boolean)} onClick={confirm}>
              <Check size={13} /> Confirm selected
            </Btn>
            <Btn variant="ghost" onClick={() => { setProposals(null); setText(""); }}>Discard</Btn>
          </div>
        </div>
      )}
    </div>
  );
}

function MediaSection({ isMe, media }) {
  const { state, dispatch } = useStore();
  const [adding, setAdding] = useState(false);
  const [videoUrl, setVideoUrl] = useState("");
  const fileRef = useRef(null);
  const [busy, setBusy] = useState(null);

  const addPhoto = async (file) => {
    if (!file) return;
    if (file.size > MAX_MEDIA_BYTES) { setBusy(`That image is ${prettyBytes(file.size)} — keep it under ${prettyBytes(MAX_MEDIA_BYTES)}.`); return; }
    setBusy("Adding…");
    try {
      const dataUrl = await readFileAsDataUrl(file);
      dispatch({ type: "MEDIA_ADD", item: { id: uid("med"), kind: "photo", name: file.name, dataUrl } });
      setBusy(null);
    } catch (e) { setBusy(e.message); }
  };

  const addVideo = () => {
    const v = videoUrl.trim();
    if (!v) return;
    dispatch({ type: "MEDIA_ADD", item: { id: uid("med"), kind: "video", url: v } });
    setVideoUrl(""); setAdding(false);
  };

  const visible = state.categoryVisibility.media !== false;

  if (!isMe && !media.length) return null;

  return (
    <section style={{ marginTop: 22 }}>
      <SectionHead icon={<Camera size={15} color="var(--gold-dk)" strokeWidth={1.6} />} title="Media" count={media.length}
        action={
          <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
            {isMe && <button className="ff-btn sm ghost" onClick={() => setAdding(x => !x)}>Add</button>}
            <CategoryToggle sectionKey="media" />
          </span>
        } />
      {visible && (<>
      {isMe && adding && (
        <div className="ff-frame" style={{ padding: 12, marginBottom: 12 }}>
          <input ref={fileRef} type="file" accept="image/*" style={{ display: "none" }}
            onChange={(e) => { addPhoto(e.target.files?.[0]); e.target.value = ""; }} />
          <Btn variant="sm wide" onClick={() => fileRef.current?.click()}><Camera size={12} /> Add a photo</Btn>
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <input className="ff-input" style={{ flex: 1 }} placeholder="Paste a video link" value={videoUrl} onChange={(e) => setVideoUrl(e.target.value)} />
            <Btn variant="sm" disabled={!videoUrl.trim()} onClick={addVideo}>Add</Btn>
          </div>
          {busy && <p className="ff-body ff-muted" style={{ fontSize: 11.5, marginTop: 8 }}>{busy}</p>}
        </div>
      )}
      {media.length ? (
        <HScroll label="Media">
          {media.map(m => (
            <div key={m.id} className="ff-tile" style={{ width: CARD_W.tile, minHeight: 120, padding: 0, overflow: "hidden", position: "relative" }}>
              {m.kind === "photo" ? (
                <div style={{ width: "100%", height: "100%", background: `url("${m.dataUrl}") center/cover` }} />
              ) : (
                <a href={m.url} target="_blank" rel="noopener noreferrer" style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 6, height: "100%", padding: 10, textAlign: "center" }}>
                  <Camera size={20} color="var(--gold-dk)" strokeWidth={1.5} />
                  <span className="ff-body ff-muted" style={{ fontSize: 10, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", width: "100%" }}>{m.url}</span>
                </a>
              )}
              {isMe && (
                <button aria-label="Remove" onClick={() => dispatch({ type: "MEDIA_DELETE", id: m.id })}
                  style={{ position: "absolute", top: 4, right: 4, background: "rgba(12,12,14,.82)", color: "#EAD79C", width: 20, height: 20, display: "grid", placeItems: "center" }}>
                  <X size={12} />
                </button>
              )}
            </div>
          ))}
        </HScroll>
      ) : isMe && !adding ? (
        <p className="ff-body ff-muted" style={{ margin: 0 }}>No photos or videos yet.</p>
      ) : null}
      </>)}
    </section>
  );
}

      </div>
      <Field label="Rating">
        <div style={{ display: "flex", gap: 6 }}>
          {Array.from({ length: REVIEW_MAX }).map((_, i) => (
            <button key={i} aria-label={`${i + 1} star${i ? "s" : ""}`} onClick={() => setRating(i + 1)}
              style={{ padding: 4, color: i < rating ? "var(--gold)" : "#C9C3B4" }}>
              <Award size={22} strokeWidth={i < rating ? 0 : 1.5} fill={i < rating ? "currentColor" : "none"} />
            </button>
          ))}
        </div>
      </Field>
      <Field label="Review" hint="How they were to work with — this goes on their profile.">
        <textarea className="ff-input" rows={4} value={text} onChange={(e) => setText(e.target.value)}
          placeholder="Reliable, great with guests, always on time…" />
      </Field>
      <Btn variant="primary wide" disabled={!text.trim()} onClick={submit}><Award size={14} /> Post review</Btn>
    </Sheet>
  );
}

/* Ask anyone in your network for a review/reference. If they don't have one
   posted yet, the fallback is simply to share your card with them. */
function AskForReviewSheet({ open, onClose }) {
  const { state, dispatch } = useStore();
  const all = useDirectory();
  const [picked, setPicked] = useState(null);
  useEffect(() => { if (open) setPicked(null); }, [open]);
  if (!open) return null;

  const asked = (id) => state.reviewRequests.some(r => r.fromId === id && r.aboutId === "me");
  const network = state.connections.map(c => all.find(p => p.id === c.id)).filter(Boolean);

  const ask = (person) => {
    dispatch({ type: "REVIEW_REQUEST", request: { id: uid("req"), aboutId: "me", fromId: person.id, fromName: person.name, at: Date.now() } });
    dispatch({ type: "TOAST", toast: `Asked ${person.name.split(" ")[0]} for a review` });
  };

  return (
    <Sheet open onClose={onClose} title="Ask for a review">
      <p className="ff-body" style={{ marginTop: 0 }}>
        Anyone in your network can leave you a review or a reference, whether or not you've worked an event
        together on FireFlair — most people you'd ask have worked with you somewhere.
      </p>
      {network.length === 0 ? (
        <div className="ff-frame" style={{ padding: 14, marginTop: 10 }}>
          <p className="ff-body" style={{ margin: "0 0 10px" }}>Nobody in your network yet. Share your card instead — they can send you a review once they have it.</p>
          <Btn variant="primary wide" onClick={() => { dispatch({ type: "TOAST", toast: "Link copied" }); onClose(); }}>
            <Share2 size={14} /> Share my card
          </Btn>
        </div>
      ) : network.map(p => (
        <div key={p.id} className="ff-frame" style={{ padding: 11, marginBottom: 8, display: "flex", gap: 11, alignItems: "center" }}>
          <Portrait src={p.photo} name={p.name} size={36} tier={p.tier} />
          <span style={{ flex: 1, minWidth: 0 }}>
            <span className="ff-display" style={{ fontSize: 13, display: "block" }}>{p.name}</span>
            <span className="ff-body ff-muted" style={{ fontSize: 12 }}>{p.profession}</span>
          </span>
          {asked(p.id)
            ? <Pill tone="ok">Asked</Pill>
            : <Btn variant="sm" onClick={() => ask(p)}><Send size={12} /> Ask</Btn>}
        </div>
      ))}
    </Sheet>
  );
}

function InfoCardSheet({ open, record, def, category, readOnly, onClose }) {
  const { dispatch } = useStore();
  const [draft, setDraft] = useState(record);
  const [busy, setBusy] = useState(null);
  const mediaRef = useRef(null);
  const docRef = useRef(null);

  useEffect(() => { setDraft(record); }, [record && record.id]);
  if (!open || !record || !draft) return null;

  const patch = (p) => {
    setDraft(d => ({ ...d, ...p }));
    if (!readOnly) dispatch({ type: "REC_PATCH", category, id: record.id, patch: p });
  };

  const addMedia = async (file) => {
    if (!file) return;
    if (file.size > MAX_MEDIA_BYTES) { setBusy(`That image is ${prettyBytes(file.size)} — keep it under ${prettyBytes(MAX_MEDIA_BYTES)}.`); return; }
    setBusy("Adding…");
    try {
      const dataUrl = await readFileAsDataUrl(file);
      patch({ media: [...(draft.media || []), { id: uid("med"), name: file.name, dataUrl }] });
      setBusy(null);
    } catch (e) { setBusy(e.message); }
  };

  const addDoc = async (file) => {
    if (!file) return;
    setBusy("Attaching…");
    try {
      const big = file.size > MAX_MEDIA_BYTES;
      const dataUrl = big ? null : await readFileAsDataUrl(file);
      patch({ document: { name: file.name, size: file.size, type: file.type || "application/pdf", dataUrl } });
      setBusy(big ? "Attached by reference — too large to store in this prototype, so it can't be reopened here." : null);
    } catch (e) { setBusy(e.message); }
  };

  const doc = draft.document;

  return (
    <Sheet open onClose={onClose} title={def.singular}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
        <CatBadge kind={def.icon} size={34} tone="light" />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="ff-label">{def.label}</div>
          {readOnly
            ? <div className="ff-display" style={{ fontSize: 17 }}>{draft.name}</div>
            : <input className="ff-input" style={{ fontSize: 17, padding: "8px 10px" }} value={draft.name}
                onChange={(e) => patch({ name: e.target.value })} placeholder={def.placeholder || def.singular} />}
        </div>
      </div>

      {draft.proposed && (
        <div className="ff-frame" style={{ padding: 12, marginBottom: 14 }}>
          <p className="ff-body" style={{ margin: "0 0 10px" }}>Proposed from your CV — nothing is on your profile until you accept it.</p>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            <Btn variant="primary" onClick={() => { dispatch({ type: "REC_ACCEPT", category, id: record.id }); patch({ proposed: false }); }}>
              <Check size={13} /> Accept
            </Btn>
            <Btn variant="danger" onClick={() => { dispatch({ type: "REC_DELETE", category, id: record.id }); onClose(); }}>Reject</Btn>
          </div>
        </div>
      )}

      {catHas(def, "proficiency") && (
        <Field label="Level">
          {readOnly ? <div className="ff-serif" style={{ fontSize: 16 }}>{draft.proficiency || "Not stated"}</div> : (
            <select className="ff-input" value={draft.proficiency || ""} onChange={(e) => patch({ proficiency: e.target.value })}>
              <option value="">Not stated</option>
              {PROFICIENCY.map(p => <option key={p} value={p}>{p}</option>)}
            </select>
          )}
        </Field>
      )}

      {catHas(def, "description") && (
        <Field label={def.singular === "Qualification" ? "Supporting detail" : "Description"}
          hint={readOnly ? undefined : "This sits behind your card — write as much as it deserves."}>
          {readOnly
            ? <p className="ff-serif" style={{ fontSize: 16, lineHeight: 1.5, margin: 0 }}>{draft.description || "Nothing written yet."}</p>
            : <textarea className="ff-input" rows={6} value={draft.description || ""}
                onChange={(e) => patch({ description: e.target.value })}
                placeholder={`What should people know about this ${def.singular.toLowerCase()}?`} />}
        </Field>
      )}

      {catHas(def, "media") && (
        <div style={{ marginBottom: 16 }}>
          <div className="ff-label" style={{ marginBottom: 8 }}>Images</div>
          {(draft.media || []).length > 0 && (
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
              {draft.media.map(m => (
                <span key={m.id} style={{ position: "relative", width: 84, height: 84, border: "1px solid var(--rule)", overflow: "hidden", background: `url("${m.dataUrl}") center/cover` }}>
                  {!readOnly && (
                    <button aria-label={`Remove ${m.name}`}
                      onClick={() => patch({ media: draft.media.filter(x => x.id !== m.id) })}
                      style={{ position: "absolute", top: 2, right: 2, background: "rgba(12,12,14,.82)", color: "#EAD79C", width: 20, height: 20, display: "grid", placeItems: "center" }}>
                      <X size={12} />
                    </button>
                  )}
                </span>
              ))}
            </div>
          )}
          {!readOnly && (<>
            <input ref={mediaRef} type="file" accept="image/*" style={{ display: "none" }}
              onChange={(e) => { addMedia(e.target.files?.[0]); e.target.value = ""; }} />
            <Btn variant="sm" onClick={() => mediaRef.current?.click()}>
              <Plus size={12} /> {(draft.media || []).length ? "Add another image" : "Add an image"}
            </Btn>
          </>)}
          {readOnly && !(draft.media || []).length && <p className="ff-body ff-muted" style={{ margin: 0 }}>No images.</p>}
        </div>
      )}

      {catHas(def, "document") && (
        <div style={{ marginBottom: 16 }}>
          <div className="ff-label" style={{ marginBottom: 8 }}>Supporting document</div>
          {doc ? (
            <div className="ff-frame" style={{ padding: 12, display: "flex", gap: 11, alignItems: "center" }}>
              <span style={{ width: 34, height: 34, flex: "none", background: "#5C1220", display: "grid", placeItems: "center" }}>
                <FileText size={16} color="#EAD79C" strokeWidth={1.6} />
              </span>
              <span style={{ flex: 1, minWidth: 0 }}>
                <span className="ff-serif" style={{ fontSize: 15, display: "block", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{doc.name}</span>
                <span className="ff-body ff-muted" style={{ fontSize: 11 }}>{doc.size ? prettyBytes(doc.size) : "Attached"} · awaiting verification</span>
              </span>
            </div>
          ) : <p className="ff-body ff-muted" style={{ margin: "0 0 10px" }}>No document attached.</p>}

          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 10 }}>
            {doc && doc.dataUrl && (
              <a className="ff-btn sm" href={doc.dataUrl} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none" }}>
                <Eye size={12} /> Open PDF
              </a>
            )}
            {!readOnly && (<>
              <input ref={docRef} type="file" accept="application/pdf,.pdf" style={{ display: "none" }}
                onChange={(e) => { addDoc(e.target.files?.[0]); e.target.value = ""; }} />
              <Btn variant="sm" onClick={() => docRef.current?.click()}>
                <Upload size={12} /> {doc ? "Replace" : "Upload PDF"}
              </Btn>
              {doc && <Btn variant="sm danger" onClick={() => patch({ document: null })}>Remove</Btn>}
            </>)}
          </div>
        </div>
      )}

      {busy && <p className="ff-body ff-muted" style={{ fontSize: 12 }}>{busy}</p>}

      {!readOnly && !draft.proposed && (
        <>
          <Divider />
          {def.onCard && (
            <label style={{ display: "flex", gap: 10, alignItems: "flex-start", marginBottom: 14 }}>
              <input type="checkbox" checked={!!draft.primary} style={{ marginTop: 3 }}
                onChange={(e) => {
                  if (e.target.checked) dispatch({ type: "REC_PRIMARY", category, id: record.id, primary: true });
                  else dispatch({ type: "REC_PRIMARY", category, id: record.id, primary: false });
                  setDraft(d => ({ ...d, primary: e.target.checked }));
                }} />
              <span>
                <span className="ff-body" style={{ display: "block" }}>Show on my Profile Card</span>
                <span className="ff-body ff-muted" style={{ fontSize: 12 }}>
                  The card shows up to {def.cardLimit} {def.label.toLowerCase()}. Your profile keeps them all.
                </span>
              </span>
            </label>
          )}
          <Btn variant="danger wide" onClick={() => { dispatch({ type: "REC_DELETE", category, id: record.id }); onClose(); }}>
            Delete this {def.singular.toLowerCase()}
          </Btn>
        </>
      )}
    </Sheet>
  );
}

/* Add a record to any category — same shape whatever the category is. */
function AddRecordSheet({ open, onClose, category, def, onAdded }) {
  const { dispatch } = useStore();
  const [name, setName] = useState("");
  const [desc, setDesc] = useState("");
  useEffect(() => { if (open) { setName(""); setDesc(""); } }, [open, category]);
  if (!open || !def) return null;

  const commit = () => {
    const rec = { ...makeRecord(category, name), description: desc.trim() };
    dispatch({ type: "REC_ADD", category, record: rec });
    onAdded && onAdded(rec);
    onClose();
  };

  return (
    <Sheet open onClose={onClose} title={`Add ${def.singular.toLowerCase()}`}>
      <Field label={def.singular}>
        <input className="ff-input" value={name} onChange={(e) => setName(e.target.value)} placeholder={def.placeholder || def.singular} autoFocus />
      </Field>
      {catHas(def, "description") && (
        <Field label="Description" hint="Optional now — you can open the card later and write properly.">
          <textarea className="ff-input" rows={3} value={desc} onChange={(e) => setDesc(e.target.value)} />
        </Field>
      )}
      <Btn variant="primary wide" disabled={!name.trim()} onClick={commit}>
        <Plus size={14} /> Add to my profile
      </Btn>
    </Sheet>
  );
}

/* Proves the category model is open-ended: a new category can be defined at
   runtime and behaves like every built-in one. */
function AddCategorySheet({ open, onClose }) {
  const { dispatch } = useStore();
  const [label, setLabel] = useState("");
  const [needsDoc, setNeedsDoc] = useState(false);
  if (!open) return null;
  const key = label.trim().toLowerCase().replace(/[^a-z0-9]+/g, "_");
  const singular = label.trim().replace(/s$/i, "") || "Item";

  return (
    <Sheet open onClose={onClose} title="Add a category">
      <p className="ff-body" style={{ marginTop: 0 }}>
        Professions, skills, interests, locations, languages, qualifications and experience are the built-in
        categories. They are not the only ones possible — a new category gets the same Information Cards.
      </p>
      <Field label="Category name" hint="For example: Awards, References, Equipment, Certifications.">
        <input className="ff-input" value={label} onChange={(e) => setLabel(e.target.value)} placeholder="Awards" />
      </Field>
      <label style={{ display: "flex", gap: 9, alignItems: "center", marginBottom: 16 }}>
        <input type="checkbox" checked={needsDoc} onChange={(e) => setNeedsDoc(e.target.checked)} />
        <span className="ff-body">Items in this category can carry a document</span>
      </label>
      <Btn variant="primary wide" disabled={!label.trim()}
        onClick={() => {
          dispatch({
            type: "CATEGORY_ADD", key,
            def: {
              label: label.trim(), singular, icon: "skills", onCard: false, custom: true,
              fields: needsDoc ? ["description", "media", "document"] : ["description", "media"],
              placeholder: singular,
            },
          });
          setLabel(""); setNeedsDoc(false); onClose();
        }}>
        Create category
      </Btn>
    </Sheet>
  );
}

/* ==========================================================================
   PROFILE PAGE — a collection of linked Information Cards.
   Every category the person has becomes a section; every record in it opens
   its own full card. This is the depth behind the Profile Card summary.
   ========================================================================== */
function ProfileSections({ person, isMe }) {
  const { state, dispatch } = useStore();
  const all = useDirectory();
  const [openRec, setOpenRec] = useState(null);
  const [addingTo, setAddingTo] = useState(null);
  const [addingCat, setAddingCat] = useState(false);
  const [asking, setAsking] = useState(false);
  const shade = isMe ? (state.profile.cardShade || "slate") : "slate";

  const records = recordsForPerson(state, person);
  const cats = isMe ? allCategories(state.profile) : BASE_CATEGORIES;
  const order = (isMe ? categoryOrder(state.profile) : Object.keys(BASE_CATEGORIES)).filter(k => !cats[k].system);
  const reviewList = records.reviews || [];
  const reviewDef = cats.reviews || BASE_CATEGORIES.reviews;
  const pendingRequests = isMe
    ? state.reviewRequests.filter(r => r.aboutId === "me" && !state.reviews.some(rv => rv.aboutId === "me" && rv.byId === r.fromId))
    : [];
  const pendingCount = pendingRequests.length;

  const network = isMe
    ? (state.connections.length
      ? state.connections.map(c => all.find(p => p.id === c.id)).filter(Boolean)
      : all.filter(p => p.id !== "me").slice(0, 5))
    : all.filter(p => p.id !== person.id && p.id !== "me").slice(0, 6);

  const venues = isMe ? VENUES.slice(0, 5) : VENUES.slice(1, 5);

  const renderCategorySection = (catKey) => {
    const def = cats[catKey];
    if (!def) return null;
    const list = (records[catKey] || []);
    if (!isMe && !list.length) return null;
    const onCardCount = list.filter(r => r.primary && !r.proposed).length;
    return (
      <section key={catKey} style={{ marginTop: 22 }}>
        <SectionHead
          icon={<CatIcon kind={def.icon} size={15} color="var(--gold-dk)" />}
          title={def.label} count={list.length}
          action={isMe && !def.system ? <button className="ff-btn sm ghost" onClick={() => setAddingTo(catKey)}>Add</button> : null} />
        {def.onCard && isMe && (
          <p className="ff-body ff-muted" style={{ fontSize: 11.5, margin: "-4px 0 8px" }}>
            {onCardCount} of {def.cardLimit} showing on your card · {list.length} on your profile
          </p>
        )}
        {list.length ? (
          <HScroll label={def.label}>
            {list.map(r => (
              <InformationCard key={r.id} record={r} def={def} themeKey={r.proposed ? "paper" : shade}
                onClick={() => setOpenRec({ record: r, def, category: catKey })} />
            ))}
            {isMe && !def.system && (
              <button className="ff-card ff-portrait ff-addtile" style={{ width: CARD_W.info }} onClick={() => setAddingTo(catKey)}>
                <span style={{ textAlign: "center" }}><Plus size={20} color="var(--gold-dk)" />
                  <span className="ff-label" style={{ display: "block", marginTop: 6 }}>Add {def.singular.toLowerCase()}</span></span>
              </button>
            )}
          </HScroll>
        ) : (
          <button className="ff-card ff-addtile" style={{ width: "100%", padding: 18 }} onClick={() => setAddingTo(catKey)}>
            <span style={{ textAlign: "center" }}><Plus size={18} color="var(--gold-dk)" />
              <span className="ff-label" style={{ display: "block", marginTop: 6 }}>Add your first {def.singular.toLowerCase()}</span></span>
          </button>
        )}
      </section>
    );
  };

  return (
    <>
      {isMe && (
        <section style={{ marginTop: 4 }}>
          <SectionHead icon={<Award size={15} color="var(--gold-dk)" strokeWidth={1.6} />} title="Questions"
            action={
              <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span className="ff-label" style={{ fontSize: 9 }}>Question Cards</span>
                <CategoryToggle sectionKey="questions" />
              </span>
            } />
          {state.categoryVisibility.questions !== false && <QuestionCardsCollection />}
        </section>
      )}

      {order.map(renderCategorySection)}

      <section style={{ marginTop: 26 }}>
        <SectionHead icon={<Users size={15} color="var(--gold-dk)" strokeWidth={1.6} />} title="Network" count={network.length}
          action={
            <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
              {isMe && <button className="ff-btn sm ghost" onClick={() => dispatch({ type: "TAB", tab: "network" })}>All</button>}
              <CategoryToggle sectionKey="profile_network" />
            </span>
          } />
        {state.categoryVisibility.profile_network !== false && (
        <HScroll label="Network" snap>
          {network.map(p => <PlayerTile key={p.id} person={p} onClick={() => dispatch({ type: "VIEW", id: p.id })} />)}
          {isMe && (
            <button className="ff-card ff-portrait ff-addtile" style={{ width: CARD_W.player }} onClick={() => dispatch({ type: "TAB", tab: "network" })}>
              <span style={{ textAlign: "center" }}><Plus size={20} color="var(--gold-dk)" />
                <span className="ff-label" style={{ display: "block", marginTop: 6 }}>Add people</span></span>
            </button>
          )}
        </HScroll>
        )}
      </section>

      <MediaSection isMe={isMe} media={isMe ? (state.profile.media || []) : []} />

      <section style={{ marginTop: 22 }}>
        <SectionHead icon={<CatIcon kind="reviews" size={15} color="var(--gold-dk)" />} title="Reviews & References" count={reviewList.length}
          action={
            <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
              {isMe && <button className="ff-btn sm ghost" onClick={() => setAsking(true)}>Ask</button>}
              <CategoryToggle sectionKey="reviews" />
            </span>
          } />
        {(state.categoryVisibility.reviews === false) ? null : (reviewList.length || (isMe && pendingCount > 0)) ? (
          <HScroll label="Reviews & References">
            {reviewList.map(r => (
              <InformationCard key={r.id} record={r} def={reviewDef} themeKey={shade}
                onClick={() => setOpenRec({ record: r, def: reviewDef, category: "reviews" })} />
            ))}
            {isMe && pendingRequests.map(req => (
              <div key={req.id} className="ff-tile" style={{ width: CARD_W.info, minHeight: 140, justifyContent: "center", alignItems: "center", textAlign: "center", gap: 6 }}>
                <Clock size={18} color="var(--gold-dk)" strokeWidth={1.5} />
                <span className="ff-serif" style={{ fontSize: 13, fontStyle: "italic" }}>Waiting on {req.fromName}</span>
              </div>
            ))}
            {isMe && (
              <button className="ff-card ff-addtile" style={{ width: CARD_W.info, minHeight: 140 }} onClick={() => setAsking(true)}>
                <span style={{ textAlign: "center" }}><Plus size={20} color="var(--gold-dk)" />
                  <span className="ff-label" style={{ display: "block", marginTop: 6 }}>Ask for a review</span></span>
              </button>
            )}
          </HScroll>
        ) : isMe ? (
          <button className="ff-card ff-addtile" style={{ width: "100%", padding: 18 }} onClick={() => setAsking(true)}>
            <span style={{ textAlign: "center" }}><Plus size={18} color="var(--gold-dk)" />
              <span className="ff-label" style={{ display: "block", marginTop: 6 }}>Ask someone you've worked with for a review</span></span>
          </button>
        ) : (
          <p className="ff-body ff-muted" style={{ margin: 0 }}>No reviews yet.</p>
        )}
      </section>

      <section style={{ marginTop: 22 }}>
        <SectionHead icon={<MapPin size={15} color="var(--gold-dk)" strokeWidth={1.6} />} title="Venues" count={venues.length}
          action={<CategoryToggle sectionKey="profile_venues" />} />
        {state.categoryVisibility.profile_venues !== false && (
        <HScroll label="Venues">
          {venues.map(v => <VenueCard key={v.id} venue={v} onClick={() => dispatch({ type: "TOAST", toast: `${v.name} — ${v.kind}, ${v.area}` })} />)}
        </HScroll>
        )}
      </section>

      {isMe && (
        <div style={{ marginTop: 18 }}>
          <Btn variant="ghost wide" onClick={() => setAddingCat(true)}><Plus size={13} /> Add another category</Btn>
          <p className="ff-body ff-muted" style={{ fontSize: 11.5, textAlign: "center", marginTop: 8 }}>
            The six built-in categories are a starting point, not the limit.
          </p>
        </div>
      )}

      <InfoCardSheet open={!!openRec} record={openRec?.record} def={openRec?.def} category={openRec?.category}
        readOnly={!isMe || !!openRec?.record?.readOnly} onClose={() => setOpenRec(null)} />
      <AddRecordSheet open={!!addingTo} category={addingTo} def={addingTo ? cats[addingTo] : null}
        onClose={() => setAddingTo(null)} />
      <AddCategorySheet open={addingCat} onClose={() => setAddingCat(false)} />
      <AskForReviewSheet open={asking} onClose={() => setAsking(false)} />
    </>
  );
}

function PersonProfile() {
  const { state, dispatch } = useStore();
  const all = useDirectory();
  const person = all.find(p => p.id === state.viewing);
  const connected = state.connections.some(c => c.id === state.viewing);
  const [reviewing, setReviewing] = useState(false);
  if (!person) return null;

  return (
    <div>
      <button aria-label="Back" onClick={() => dispatch({ type: "VIEW", id: null })}
        style={{

function ChipEdit({ values, onChange, placeholder, flags, ink, rule }) {
  const [t, setT] = useState("");
  const add = () => { const v = t.trim().replace(/,$/, ""); if (!v) return; if (!values.includes(v)) onChange([...values, v]); setT(""); };
  return (
    <div>
      {values.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginBottom: 6 }}>
          {values.map((v, i) => (
            <span key={v + i} className="ff-tagchip" style={{ color: ink, borderColor: rule }}>
              {flags && <span style={{ fontSize: 12 }}>{flagFor(v)}</span>}{v}
              <button onClick={() => onChange(values.filter((_, j) => j !== i))} aria-label={`Remove ${v}`} style={{ color: ink }}><X size={11} /></button>
            </span>
          ))}
        </div>
      )}
      <input className="ff-cardin" value={t} placeholder={placeholder} style={{ color: ink, borderBottomColor: rule }}
        onChange={(e) => setT(e.target.value)} onBlur={add}
        onKeyDown={(e) => { if (e.key === "Enter" || e.key === ",") { e.preventDefault(); add(); } }} />
    </div>
  );
}

function ManualBuild() {
  const { state, dispatch } = useStore();
  const [d, setD] = useState({
    name: state.profile.name || "", professions: [], photo: state.profile.photo,
    skills: [], interests: [], locations: [], languages: ["English"],
  });
  const ready = d.name.trim() && d.professions.length > 0;

  const commit = () => {
    const byCategory = {};
    const push = (cat, values) => {
      const list = (values || []).filter(Boolean);
      if (!list.length) return;
      const limit = BASE_CATEGORIES[cat].cardLimit || 3;
      byCategory[cat] = list.map((v, i) => ({ ...makeRecord(cat, v), primary: i < limit }));
    };
    push("professions", d.professions);
    push("skills", d.skills);
    push("interests", d.interests);
    push("locations", d.locations);
    push("languages", d.languages);
    dispatch({ type: "PROFILE", patch: { name: d.name.trim(), photo: d.photo } });
    dispatch({ type: "RECORDS_MERGE", byCategory });
    dispatch({ type: "GO", route: "review" });
  };

  return (
    <div>

      <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap", margin: "18px 0" }}>
        {Object.entries(THEMES).map(([k, th]) => (
          <button key={k} onClick={() => dispatch({ type: "PROFILE", patch: { theme: k } })} aria-label={th.name}
            style={{ width: 32, height: 32, borderRadius: "50%", background: th.swatch, border: state.profile.theme === k ? "2px solid var(--gold)" : "1px solid var(--rule)" }} />
        ))}
      </div>

      <Btn variant="primary wide" disabled={!ready} onClick={commit}>
        Review my cards <ChevronRight size={15} />

      <div style={{ height: 10 }} />
      <Btn variant="ghost wide" onClick={() => dispatch({ type: "GO", route: "build" })}>Send a CV instead</Btn>
    </div>
  );
}

function ReviewScreen() {
  const { state, dispatch } = useStore();
  const [name, setName] = useState(state.profile.name);
  const [openRec, setOpenRec] = useState(null);
  const [addingTo, setAddingTo] = useState(null);

  const cats = allCategories(state.profile);
  const order = categoryOrder(state.profile).filter(k => !cats[k].system);
  const records = state.profile.records;
  const total = order.reduce((n, k) => n + (records[k] || []).length, 0);
  const proposed = order.reduce((n, k) => n + (records[k] || []).filter(r => r.proposed).length, 0);
  const onCard = CARD_CATEGORIES.reduce((n, k) => n + (records[k] || []).filter(r => r.primary && !r.proposed).length, 0);
  const missing = CARD_CATEGORIES.filter(k => !(records[k] || []).some(r => !r.proposed));

  return (
    <div>
      <Steps n={3} of={5} />
      <h1 className="ff-h1">{total ? `Your profile holds ${total} pieces of information` : "Build your cards"}</h1>
      <p className="ff-body" style={{ marginTop: 8 }}>
        {total
          ? "Pick what your Profile Card shows. Everything else stays on your profile, behind the card, where people can explore it."
          : "Add what you want people to see. You can always send a CV later."}
      </p>
      {proposed > 0 && (
        <div className="ff-frame" style={{ padding: 12, marginTop: 12 }}>
          <Pill tone="warn">{proposed} proposed</Pill>
          <p className="ff-body" style={{ margin: "8px 0 0" }}>Open each one to accept, edit or reject it. Nothing proposed is on your profile yet.</p>
        </div>
      )}

      <Divider />
      <Field label="Name on your card">
        <input className="ff-input" value={name} placeholder="Your name"
          onChange={(e) => { setName(e.target.value); dispatch({ type: "PROFILE", patch: { name: e.target.value } }); }} />
      </Field>

      {order.map(catKey => {
        const def = cats[catKey];
        const list = records[catKey] || [];
        const picked = list.filter(r => r.primary && !r.proposed).length;
        return (
          <section key={catKey} style={{ marginTop: 18 }}>
            <SectionHead icon={<CatIcon kind={def.icon} size={15} color="var(--gold-dk)" />}
              title={def.label} count={list.length}
              action={<button className="ff-btn sm ghost" onClick={() => setAddingTo(catKey)}>Add</button>} />
            {def.onCard && (
              <p className="ff-body ff-muted" style={{ fontSize: 11.5, margin: "-4px 0 8px" }}>
                {picked} of {def.cardLimit} on your card
              </p>
            )}
            {list.length ? list.map(r => (
              <div key={r.id} className="ff-info" style={{ display: "flex", gap: 11, alignItems: "center" }}>
                <CatBadge kind={def.icon} size={30} tone="light" />
                <span style={{ flex: 1, minWidth: 0 }}>
                  <span className="ff-serif" style={{ fontSize: 16, display: "block", color: "#1D1B18" }}>{r.name}</span>
                  <span className="ff-body ff-muted" style={{ fontSize: 11.5, display: "block", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    {r.proposed ? "Proposed — needs your review" : (r.description ? r.description : "No description yet")}
                  </span>
                </span>
                {def.onCard && !r.proposed && (
                  <button aria-label={r.primary ? "Remove from card" : "Show on card"}
                    onClick={() => dispatch({ type: "REC_PRIMARY", category: catKey, id: r.id, primary: !r.primary })}
                    style={{ padding: 6, color: r.primary ? "var(--gold-dk)" : "#B0A895" }}>
                    {r.primary ? <Eye size={16} /> : <EyeOff size={16} />}
                  </button>
                )}
                <button className="ff-btn sm ghost" onClick={() => setOpenRec({ record: r, def, category: catKey })}>Open</button>
              </div>
            )) : (
              <button className="ff-card ff-addtile" style={{ width: "100%", padding: 14 }} onClick={() => setAddingTo(catKey)}>
                <span className="ff-label">Add your first {def.singular.toLowerCase()}</span>
              </button>
            )}
          </section>
        );
      })}

      {missing.length > 0 && (
        <div className="ff-frame" style={{ padding: 14, marginTop: 16 }}>
          <div className="ff-label" style={{ marginBottom: 8 }}>Still missing</div>
          <p className="ff-body" style={{ marginTop: 0 }}>A complete card shows all five: professions, skills, interests, locations and languages.</p>
          <div>{missing.map(k => <span key={k} className="ff-chip">{cats[k].label}</span>)}</div>
        </div>
      )}

      <div style={{ height: 18 }} />
      <Btn variant="primary wide" disabled={!onCard || !name.trim()}
        onClick={() => dispatch({ type: "GO", route: state.session.verified ? "live" : "phone" })}>
        Save and publish <ChevronRight size={15} />
      </Btn>
      {(!onCard || !name.trim()) && <p className="ff-body ff-muted" style={{ fontSize: 12, textAlign: "center", marginTop: 8 }}>
        Add your name and put at least one card on your profile to publish.
      </p>}
      <p className="ff-body ff-muted" style={{ fontSize: 12, textAlign: "center", marginTop: 10 }}>
        We verify your number at this point, and not before.
      </p>

      <InfoCardSheet open={!!openRec} record={openRec?.record} def={openRec?.def} category={openRec?.category}
        onClose={() => setOpenRec(null)} />
      <AddRecordSheet open={!!addingTo} category={addingTo} def={addingTo ? cats[addingTo] : null}
        onClose={() => setAddingTo(null)} />
    </div>
  );
}

function InviteSheet({ open, onClose }) {
  const { state, dispatch } = useStore();
  const [granted, setGranted] = useState(false);
  const [picked, setPicked] = useState([]);
  const invitedIds = state.invitations.map(i => i.id);

  return (
    <Sheet open={open} onClose={onClose} title="Invite people you work with">
      {!granted ? (
        <>
          <p className="ff-body">FireFlair can check your contacts for people already here. We only read them when you allow it, and we never invite anyone on your behalf.</p>
          <div style={{ height: 12 }} />
          <Btn variant="primary wide" onClick={() => setGranted(true)}>Allow contact access</Btn>
          <div style={{ height: 8 }} />
          <Btn variant="ghost wide" onClick={onClose}>Not now — share my link</Btn>
        </>
      ) : (
        <>
          {CONTACTS.map(c => {
            const on = picked.includes(c.id), done = invitedIds.includes(c.id);
            return (
              <button key={c.id} disabled={done} onClick={() => setPicked(p => on ? p.filter(x => x !== c.id) : [...p, c.id])}
                className="ff-frame" style={{ width: "100%", textAlign: "left", padding: 11, marginBottom: 8, display: "flex", gap: 11, alignItems: "center", opacity: done ? .55 : 1, background: on ? "rgba(201,162,39,.10)" : "var(--paper)" }}>
                <Portrait name={c.name} size={36} ring={c.onFF ? "#C9A227" : "#B9B1A2"} />
                <span style={{ flex: 1, minWidth: 0 }}>
                  <span className="ff-display" style={{ fontSize: 13, display: "block" }}>{c.name}</span>
                  <span className="ff-body ff-muted" style={{ fontSize: 12 }}>{c.note}{c.onFF ? ` · ${c.tag}` : ""}</span>
                </span>
                {done ? <Pill tone="ok">Invited</Pill> : on ? <Check size={17} color="var(--gold-dk)" /> : <Plus size={15} color="#B0A895" />}
              </button>
            );
          })}
          <Btn variant="primary wide" disabled={!picked.length}
            onClick={() => {
              const people = CONTACTS.filter(c => picked.includes(c.id));
              dispatch({ type: "INVITE", people });
              dispatch({ type: "CONNECT", people: people.filter(p => p.onFF) });
              setPicked([]); onClose();
              dispatch({ type: "TOAST", toast: `${people.length} invitation${people.length > 1 ? "s" : ""} sent` });
            }}>
            <Send size={15} /> Invite {picked.length || ""}
          </Btn>
          <p className="ff-body ff-muted" style={{ fontSize: 12, marginTop: 12, marginBottom: 0 }}>
            An invitation is not a connection. They accept first.
          </p>
        </>
      )}
    </Sheet>
  );
}

function GroupedPeople({ onPick, selectable, scope = "" }) {
  const { state, dispatch } = useStore();
  const all = useDirectory();
  const order = ["Bartenders", "Waiters", "DJs & music", "Hosts", "Chefs", "Photographers", "Your profile"];
  const groups = all.reduce((m, p) => { (m[p.group] = m[p.group] || []).push(p); return m; }, {});
  const keys = Object.keys(groups).sort((a, b) => order.indexOf(a) - order.indexOf(b));

  return (
    <>
      {keys.map(g => {
        const key = `${scope}${g}`;
        const visible = state.categoryVisibility[key] !== false;
        return (
          <section key={g} style={{ marginTop: 20 }}>
            <SectionHead icon={<GroupIcon group={g} />} title={g} count={groups[g].length}
              action={<CategoryToggle sectionKey={key} />} />
            {visible && (
              <HScroll label={g} snap>
                {groups[g].map(p => (
                  <PlayerTile key={p.id} person={p} selected={selectable && state.selection.includes(p.id)}
                    onClick={() => onPick(p)} />
                ))}
                <button className="ff-card ff-portrait ff-addtile" style={{ width: CARD_W.player }}
                  onClick={() => dispatch({ type: "TOAST", toast: "Invitations go out by WhatsApp with a link to create a card." })}>

                    <span className="ff-label" style={{ display: "block", marginTop: 6 }}>Invite</span></span>

              </HScroll>
            )}
          </section>
        );
      })}

  );
}

/* Ranking categories — a config array, not one component per ranking, so a

  );
}

  const { state, dispatch } = useStore();
  if (!engagement) return null;
  const shift = state.shifts.find(s2 => s2.id === engagement.shiftId);
  const event = state.events.find(v => v.id === shift?.eventId);
  const e = engagement;
  if (!shift) return null;
  const act = (st) => { dispatch({ type: "ENG_STATE", id: e.id, state: st }); onClose(); };

  return (
    <Sheet open onClose={onClose} title={shift.role}>
      <ShiftCard shift={shift} event={event} footer={
        <div>
          <div style={{ marginBottom: 10 }}><Pill tone={ENG_TONE[e.state]}><span className="ff-dot" /> {ENG_LABEL[e.state]}</Pill></div>
          {e.state === "requested" && (

  return {

    skills: names("skills"), interests: names("interests"),
    locations: names("locations"), languages: names("languages"),
  };
}

function TeamProfile() {
  const { state, dispatch } = useStore();
  const [editing, setEditing] = useState(false);
  const [d, setD] = useState(() => draftFromProfile(state));

  if (!state.profile.live) return <Empty icon={<User size={26} />} title="Finish creating your profile and your card appears here."
    action={<Btn variant="primary" onClick={() => dispatch({ type: "TAB", tab: "home" })}>Continue setting up</Btn>} />;

  const me = meAsStaff(state.profile, state.session);
  const startEdit = () => { setD(draftFromProfile(state)); setEditing(true); };

  /* Editing the card edits NAMES only. Descriptions, media and documents
     live on the records and are never clobbered by a card edit: existing
     records are matched by name and kept whole. */
  const save = () => {
    const sync = (cat, values) => {
      const existing = recsOf(state.profile, cat);
      const limit = BASE_CATEGORIES[cat].cardLimit || 3;
      const kept = [];
      (values || []).filter(Boolean).forEach((v, i) => {
        const match = existing.find(r => r.name.toLowerCase() === v.toLowerCase());
        kept.push(match ? { ...match, name: v } : { ...makeRecord(cat, v), primary: i < limit });
      });
      existing.filter(r => r.proposed && !kept.some(k => k.id === r.id)).forEach(r => kept.push(r));
      if (!kept.some(r => r.primary && !r.proposed)) {
        kept.slice(0, limit).forEach(r => { if (!r.proposed) r.primary = true; });
      }
      dispatch({ type: "REC_BULK", category: cat, list: kept });
    };
    sync("professions", d.professions);
    sync("skills", d.skills);
    sync("interests", d.interests);
    sync("locations", d.locations);
    sync("languages", d.languages);
    dispatch({ type: "PROFILE", patch: { name: d.name.trim() || state.profile.name, photo: d.photo } });
    setEditing(false);
    dispatch({ type: "TOAST", toast: "Card updated" });
  };

  return (
    <div>
      <div className="ff-eyebrow">FF Team</div>
      <h1 className="ff-h1" style={{ marginTop: 4, marginBottom: 14 }}>{editing ? "Edit your card" : "Your card"}</h1>

      {editing ? (
        <>
          <EditablePlayerCard draft={d} setDraft={setD} themeKey={state.profile.theme}
            tag={state.session.tag} tier={state.profile.tier} level={state.profile.level}
            onPhoto={(url) => setD(x => ({ ...x, photo: url }))} />
          <p className="ff-body ff-muted" style={{ fontSize: 11.5, textAlign: "center", marginTop: 10 }}>
            Descriptions, images and documents stay on the full cards below — editing here only changes the names.
          </p>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 14 }}>
            <Btn variant="primary" onClick={save}><Check size={14} /> Save card</Btn>
            <Btn variant="ghost" onClick={() => setEditing(false)}>Cancel</Btn>
          </div>
        </>
      ) : (
        <>
          <PlayerCard person={me} format="full" themeKey={state.profile.theme} actions={{
            onBook: () => dispatch({ type: "TOAST", toast: "This is what people booking you will see" }),
            onReview: () => dispatch({ type: "TOAST", toast: "This is what people reviewing you will see" }),
            onJoin: () => dispatch({ type: "TOAST", toast: "This is what people joining from your card will see" }),
          }} />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 16 }}>
            <Btn variant="primary" onClick={startEdit}><Pencil size={13} /> Edit card</Btn>
            <Btn onClick={() => dispatch({ type: "TOAST", toast: "Link copied" })}><Share2 size={13} /> Share</Btn>
          </div>
          <div style={{ marginTop: 10, display: "flex", justifyContent: "center" }}>
            <WalletButton kind="profile" dark={false} payload={{ tag: state.session.tag, name: state.profile.name }} />
          </div>
        </>
      )}

      <AIProfileCompletion />

      <ProfileSections person={me} isMe />

      <div className="ff-frame" style={{ padding: 12, marginTop: 22, display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
        <Pill tone="gold"><Hash size={11} /> {state.session.tag}</Pill>
        <Pill tone="ok"><ShieldCheck size={11} /> Verified</Pill>
        <Pill>Level {state.profile.level}</Pill>
        <Pill>{TIERS[state.profile.tier].name} tier</Pill>
      </div>
    </div>
  );
}
