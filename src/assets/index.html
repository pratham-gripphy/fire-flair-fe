/* Homepage card creator — the same EditablePlayerCard used partway through
   onboarding, dropped onto the homepage itself. Typing here fills the same
   draft shape ManualBuild commits, so "Join FireFlair" carries the card
   straight into the real profile rather than starting over. */
function HomeCardCreator() {
  const { state, dispatch } = useStore();
  const [d, setD] = useState({
    name: "", professions: [], photo: null,
    skills: [], interests: [], locations: [], languages: [],
  });
  const started = d.name.trim() || d.professions.length > 0;

  const joinWithCard = () => {
    const byCategory = {};
    const push = (cat, values) => {
      const list = (values || []).filter(Boolean);
      if (!list.length) return;
      const limit = BASE_CATEGORIES[cat].cardLimit || 3;
      byCategory[cat] = list.map((v, i) => ({ ...makeRecord(cat, v), primary: i < limit }));
    };
    push("professions", d.professions);
    push("skills", d.skills);
    push("interests", d.interests);
    push("locations", d.locations);
    push("languages", d.languages);
    dispatch({ type: "PROFILE", patch: { name: d.name.trim(), photo: d.photo } });
    if (Object.keys(byCategory).length) dispatch({ type: "RECORDS_MERGE", byCategory });
    /* The card actually exists now — claim the one-time creation XP. Claiming
       is idempotent, so coming back through here never awards it twice. */
    dispatch({ type: "CARD_CREATED_XP" });
    dispatch({ type: "ROLE", role: "team" });
    dispatch({ type: "GO", route: "tag" });
    dispatch({ type: "TOAST", toast: `Card created · +${XP_VALUES.task} XP` });
  };

  return (
    <div style={{ marginBottom: 22 }}>
      <p className="ff-body" style={{ textAlign: "center", marginTop: 0, marginBottom: 16 }}>
        Try it now — type your own details and watch your card build itself.
      </p>
      <EditablePlayerCard draft={d} setDraft={setD} themeKey="onyx" tag="-----"
        tier="standard" level={1} onPhoto={(url) => setD(x => ({ ...x, photo: url }))} />
      <div style={{ textAlign: "center", marginTop: 16 }}>
        <Btn variant="primary" disabled={!started} onClick={joinWithCard}>
          <ChevronRight size={14} /> Create my card · +{XP_VALUES.task} XP
        </Btn>
        {!started && <p className="ff-body ff-muted" style={{ fontSize: 11.5, marginTop: 8 }}>Start typing above — your name is enough to begin.</p>}
      </div>
    </div>
  );
}

          {item(Share2, "Share my card", `${CARD_DOMAIN}/${state.session.tag || "-----"}`, go(() => dispatch({ type: "TOAST", toast: "Link copied" })))}
        </>
      ) : (
        <>
          {item(Calendar, "Create event card", "The parent for all your shifts", go(() => dispatch({ type: "TAB", tab: "home", route: "eventNew" })))}
          {item(Clock, "Create shift card", "One staffing requirement", go(() => dispatch({ type: "TAB", tab: "home", route: "shiftNew" })))}
          {item(Search, "Find staff", "Browse cards and build your team", go(() => dispatch({ type: "TAB", tab: "home", route: "staffHome" })))}
        </>
      )}
    </Sheet>
  );
}

const NAV = [
  { key: "home", label: "Home", mark: "home" },
  { key: "network", label: "Network", mark: "network" },
  { key: "__ff", label: "", mark: null },
  { key: "bookings", label: "Bookings", mark: "bookings" },
  { key: "profile", label: "Profile", mark: "profile" },
];

/* XP bar — same footprint as the basket bar, filling as the person earns XP
   toward their next FireFlair tier. The reward on the right is the same Coin
   used everywhere else, in that tier's metal, so "reaching Bronze" always
   looks like the same coin the rest of the app already shows for Bronze. */
/* ==========================================================================
   XP AREA — opened by the central FireFlair coin.
   Today it holds XP, level and tasks. It is deliberately the person's whole
   progression/account area, so Wallet, earnings and rewards can be added as
   further blocks here without touching the navigation.
   ========================================================================== */
/* XP Beta timeline — the current and next quarterly period, generated from
   XP_TIMELINE rather than hand-written, so a future quarter is a data change
   to XP_CURRENT_PERIOD/XP_TIMELINE, not a UI rewrite. */
function XPTimeline() {
  const idx = XP_TIMELINE.findIndex(p => p.year === XP_CURRENT_PERIOD.year && p.q === XP_CURRENT_PERIOD.q);
  const visible = XP_TIMELINE.slice(Math.max(0, idx), idx + 2);
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ textAlign: "center", marginBottom: 8 }}>
        <span className="ff-eyebrow" style={{ fontSize: 10 }}>FF XP Beta</span>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        {visible.map((p, i) => {
          const isCurrent = p.year === XP_CURRENT_PERIOD.year && p.q === XP_CURRENT_PERIOD.q;
          return (
            <React.Fragment key={xpPeriodKey(p)}>
              <div style={{ textAlign: "center", flex: "none" }}>
                <div className="ff-display" style={{
                  fontSize: isCurrent ? 15 : 12, color: isCurrent ? "var(--ink)" : "#8C857A",
                  letterSpacing: ".06em",
                }}>{quarterLabel(p)}</div>
                <div className="ff-body ff-muted" style={{ fontSize: 9, marginTop: 2 }}>
                  {isCurrent ? "Current" : "Next"}
                </div>
              </div>
              {i < visible.length - 1 && (
                <div style={{ flex: 1, height: 2, background: "linear-gradient(90deg, var(--gold), rgba(201,162,39,.15))" }} />
              )}
            </React.Fragment>
          );
        })}
      </div>
      <p className="ff-body ff-muted" style={{ fontSize: 10.5, textAlign: "center", marginTop: 8, marginBottom: 0 }}>
        FireFlair XP runs in quarterly performance periods. Your progress resets each quarter — nothing you've earned is lost.
      </p>
    </div>
  );
}

function XPSheet({ open, onClose }) {
  const { state, dispatch } = useStore();
  if (!open) return null;
  const info = xpProgress(state.profile.xp);
  const claimed = state.profile.xpClaimed || [];
  const answers = state.profile.answers || {};
  const answered = Object.keys(answers).filter(k => answers[k] !== "").length;

  return (
    <Sheet open onClose={onClose} title="Your FireFlair">
      <XPTimeline />
      <div className="ff-frame ff-lattice" style={{ padding: 18, textAlign: "center", marginBottom: 16 }}>
        <Corners />
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 10 }}>
          <Coin size={58} tier={info.currentTier} />
        </div>
        <div className="ff-display" style={{ fontSize: 26 }}>{info.xp} XP</div>
        <div className="ff-label" style={{ marginTop: 4 }}>{TIERS[info.currentTier].name}</div>
        <div className="ff-xptrack" style={{ margin: "14px 0 8px", background: "rgba(20,20,22,.12)" }}>
          <div className="ff-xpfill" style={{ width: `${info.pct}%` }} />
        </div>
        <p className="ff-body ff-muted" style={{ margin: 0, fontSize: 12 }}>
          {info.next ? `${info.nextXp - info.xp} XP to ${info.next.label}` : "Top numbered tier reached"}
        </p>
        <p className="ff-body ff-muted" style={{ margin: "4px 0 0", fontSize: 10.5 }}>
          {state.profile.xpPeriod || 0} XP this quarter · {quarterLabel(XP_CURRENT_PERIOD)}
        </p>
      </div>

      <div className="ff-label" style={{ marginBottom: 8 }}>Levels</div>
      {XP_LEVELS.map(l => {
        const isGold = l.tier === "gold";
        const reached = isGold ? false : info.xp >= l.xp;
        return (
          <div key={l.tier} className="ff-frame" style={{ padding: 12, marginBottom: 8, display: "flex", gap: 11, alignItems: "center", opacity: reached ? 1 : .62 }}>
            <Coin size={30} tier={l.tier} />
            <span style={{ flex: 1, minWidth: 0 }}>
              <span className="ff-display" style={{ fontSize: 13, display: "block" }}>
                {l.label} · {isGold ? `Top performers — ${quarterLabel(XP_CURRENT_PERIOD)}` : `${l.xp} XP`}
              </span>
              <span className="ff-body ff-muted" style={{ fontSize: 11.5 }}>{l.unlocks}</span>
            </span>
            {isGold ? <Pill tone="warn">Quarterly</Pill> : reached ? <Pill tone="ok"><Check size={10} /> Unlocked</Pill> : <Pill>Locked</Pill>}
          </div>
        );
      })}

      <Divider />
      <div className="ff-label" style={{ marginBottom: 8 }}>Ways to earn</div>
      {XP_TASKS.map(t => {
        const done = claimed.includes(t.id);
        return (
          <div key={t.id} className="ff-info" style={{ display: "flex", gap: 11, alignItems: "center" }}>
            <CatBadge kind={done ? "qualification" : "skills"} size={28} tone="light" />
            <span style={{ flex: 1, minWidth: 0 }}>
              <span className="ff-serif" style={{ fontSize: 15, display: "block", color: "#1D1B18" }}>{t.label}</span>
              <span className="ff-body ff-muted" style={{ fontSize: 11.5 }}>{t.hint}</span>
            </span>
            {done ? <Pill tone="ok"><Check size={10} /> Earned</Pill> : <Pill tone="gold">+{t.xp} XP</Pill>}
          </div>
        );
      })}

      <div className="ff-info" style={{ display: "flex", gap: 11, alignItems: "center" }}>
        <CatBadge kind="interests" size={28} tone="light" />
        <span style={{ flex: 1, minWidth: 0 }}>
          <span className="ff-serif" style={{ fontSize: 15, display: "block", color: "#1D1B18" }}>Answer Question Cards</span>
          <span className="ff-body ff-muted" style={{ fontSize: 11.5 }}>{answered} answered · on your profile</span>
        </span>
        <Pill tone="gold">+{XP_VALUES.question} XP each</Pill>
      </div>

      <Divider />
      <p className="ff-body ff-muted" style={{ fontSize: 11.5, margin: 0 }}>
        Wallet, earnings and rewards will live here too — this is your FireFlair account area.
      </p>
    </Sheet>
  );
}

function XPBar({ info }) {
  const { dispatch } = useStore();
  const atMax = !info.next;
  return (
    <div className="ff-xpbar">
      <div style={{ display: "flex", alignItems: "center", gap: 10, maxWidth: 560, margin: "0 auto" }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 5 }}>
            <span style={{ fontSize: 10, letterSpacing: ".12em", textTransform: "uppercase", color: "#EAD79C" }}>
              {atMax ? "Top tier reached" : `${info.xp} / ${info.nextXp} XP`}
            </span>
            {!atMax && <span style={{ fontSize: 9, color: "rgba(244,239,228,.55)" }}>Next: {info.next.label}</span>}
          </div>
          <div className="ff-xptrack">
            <div className="ff-xpfill" style={{ width: `${info.pct}%` }} />
          </div>
        </div>
        <button onClick={() => dispatch({ type: "TOAST", toast: atMax ? "You're at the top FireFlair tier." : `${info.nextXp - info.xp} XP to ${info.next.label}` })}
          aria-label="Your FireFlair tier" style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
          <Coin size={30} tier={info.currentTier} />
          <span style={{ fontSize: 7, letterSpacing: ".1em", textTransform: "uppercase", color: "#D9BE68" }}>{TIERS[info.currentTier].name}</span>
        </button>
      </div>
    </div>
  );
}

function Shell({ children }) {
  const { state, dispatch } = useStore();
  const [act, setAct] = useState(false);
  const [xpOpen, setXpOpen] = useState(false);
  const [shareOpen, setShareOpen] = useState(false);
  const isTeam = state.role === "team";
  const isStaff = state.role === "staff";
  const goTab = (tab) => {
    if (!state.role) { dispatch({ type: "TAB", tab }); return; }
    if (isTeam) dispatch({ type: "TAB", tab, route: state.profile.live ? "home" : state.route });
    else dispatch({ type: "TAB", tab, route: tab === "home" ? "staffHome" : state.route });
  };

  useEffect(() => {
    if (!state.toast) return;
    const t = setTimeout(() => dispatch({ type: "TOAST", toast: null }), 2400);
    return () => clearTimeout(t);
  }, [state.toast, dispatch]);

  const basket = isStaff && state.selection.length > 0;
  const xpInfo = isTeam && state.profile.live ? xpProgress(state.profile.xp) : null;
  const bottomBarUp = basket || xpInfo;

  return (
    <div className="ff-shell">
      <header className="ff-topbar ff-lattice">
        <div className="ff-topbar-in">
          <Coin size={30} tier={isTeam ? state.profile.tier : "gold"} />
          <div style={{ lineHeight: 1.1 }}>
            <Wordmark size={13} />
            <div style={{ fontSize: 9, letterSpacing: ".2em", color: "rgba(234,215,156,.7)", textTransform: "uppercase" }}>
              {isTeam ? "Team" : isStaff ? "Staff" : "Welcome"}
            </div>
          </div>
          {state.role && (
            <nav className="ff-desknav">
              {NAV.filter(n => n.key !== "__ff").map(n => (
                <button key={n.key} className={state.tab === n.key ? "on" : ""} onClick={() => goTab(n.key)}>{n.label}</button>
              ))}
              <button onClick={() => setXpOpen(true)} style={{ marginLeft: 10 }} aria-label="Your FireFlair XP"><Coin size={30} tier="gold" /></button>
              <button onClick={() => isTeam ? setShareOpen(true) : setAct(true)}
                aria-label={isTeam ? "Share your FireFlair card" : "Add FireFlair"}
                style={{ marginLeft: 6, display: "flex", alignItems: "center", gap: 7, fontSize: 11, letterSpacing: ".14em", textTransform: "uppercase", color: "rgba(234,215,156,.8)" }}>
                Add <AddFireFlairMark size={16} />
              </button>
            </nav>
          )}
          {state.role && (
            <button style={{ marginLeft: "auto", color: "rgba(234,215,156,.8)", fontSize: 10, letterSpacing: ".14em", textTransform: "uppercase", border: "1px solid rgba(201,162,39,.4)", padding: "7px 10px" }}
              onClick={() => dispatch({ type: "ROLE", role: isTeam ? "staff" : "team" })}>
              {isTeam ? "FF Staff" : "FF Team"}
            </button>
          )}
        </div>
        {/* Desktop companion row: XP + booking status, same information as the
            mobile bottom bars, laid out for the header instead of floating
            fixed at the bottom of a wide viewport. */}
        {(xpInfo || basket) && (
          <div className="ff-topbar-extras">
            {xpInfo && (
              <button onClick={() => setXpOpen(true)} style={{ display: "flex", alignItems: "center", gap: 10, flex: 1, minWidth: 0 }} aria-label="Your FireFlair XP">
                <Coin size={24} tier={xpInfo.currentTier} />
                <span style={{ flex: 1, minWidth: 0 }}>
                  <span style={{ display: "flex", justifyContent: "space-between", fontSize: 10, letterSpacing: ".1em", textTransform: "uppercase", color: "#EAD79C", marginBottom: 3 }}>
                    <span>{xpInfo.xp} XP</span>
                    <span style={{ color: "rgba(244,239,228,.55)" }}>{xpInfo.next ? `Next: ${xpInfo.next.label}` : "Top tier"}</span>
                  </span>
                  <span className="ff-xptrack" style={{ height: 5 }}><span className="ff-xpfill" style={{ width: `${xpInfo.pct}%` }} /></span>
                </span>
              </button>
            )}
            {basket && (
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 11, letterSpacing: ".1em", textTransform: "uppercase", color: "#EAD79C" }}>{state.selection.length} selected</span>
                <button onClick={() => dispatch({ type: "CLEAR_SELECTION" })} style={{ color: "rgba(244,239,228,.6)", fontSize: 11, letterSpacing: ".08em", textTransform: "uppercase" }}>Clear</button>
                <button onClick={() => dispatch({ type: "TAB", tab: "home", route: state.shifts.length ? "shiftSend" : "shiftNew" })}
                  style={{ border: "1px solid var(--gold)", color: "#EAD79C", padding: "7px 12px", fontSize: 10, letterSpacing: ".1em", textTransform: "uppercase" }}>
                  Build team
                </button>
              </div>
            )}
          </div>
        )}
      </header>

      <main className="ff-main" style={{ paddingBottom: bottomBarUp ? 190 : undefined }}>{children}</main>

      {basket && (
        <div className="ff-basket">
          <div style={{ display: "flex", alignItems: "center", gap: 10, maxWidth: 560, margin: "0 auto" }}>
            <Coin size={26} />
            <span style={{ flex: 1, fontSize: 11, letterSpacing: ".12em", textTransform: "uppercase", color: "#EAD79C" }}>
              {state.selection.length} selected
            </span>
            <button onClick={() => dispatch({ type: "CLEAR_SELECTION" })} style={{ color: "rgba(244,239,228,.6)", fontSize: 11, letterSpacing: ".1em", textTransform: "uppercase" }}>Clear</button>
            <button onClick={() => dispatch({ type: "TAB", tab: "home", route: state.shifts.length ? "shiftSend" : "shiftNew" })}
              style={{ border: "1px solid var(--gold)", color: "#EAD79C", padding: "9px 13px", fontSize: 11, letterSpacing: ".12em", textTransform: "uppercase" }}>
              Build team
            </button>
          </div>

      {xpInfo && <XPBar info={xpInfo} />}

      {state.toast && (
        <div style={{ position: "fixed", left: 14, right: 14, bottom: bottomBarUp ? 150 : 90, zIndex: 55, display: "flex", justifyContent: "center" }}>
          <span style={{ background: "#141416", color: "#EAD79C", border: "1px solid var(--gold-dk)", padding: "10px 16px", fontSize: 12, letterSpacing: ".06em", maxWidth: 420, textAlign: "center" }}>{state.toast}</span>
        </div>

      <nav className="ff-bottomnav ff-lattice">
        <div className="ff-bottomnav-in">
          {NAV.map(n => n.key === "__ff" ? (
            <div key="ff" className="ff-navcentre">
              <button className="ff-coinbtn" onClick={() => state.role ? setXpOpen(true) : dispatch({ type: "TAB", tab: "home" })} aria-label="Your FireFlair XP">
                <Coin size={56} tier={isTeam ? xpProgress(state.profile.xp).currentTier : "gold"} />
              </button>
            </div>
          ) : (
            <button key={n.key} className={`ff-navbtn ${state.tab === n.key ? "on" : ""}`}
              onClick={() => goTab(n.key)} aria-label={n.label} title={n.label}>
              <NavMark shape={n.mark} size={23} tone={state.tab === n.key ? "#EAD79C" : "#D8D6D0"} />
            </button>
          ))}
        </div>
      </nav>

      <ActionSheet open={act} onClose={() => setAct(false)} />
      <XPSheet open={xpOpen} onClose={() => setXpOpen(false)} />
      <ShareCardSheet open={shareOpen} onClose={() => setShareOpen(false)} />
    </div>
  );
}

function TeamRouter() {
  const { state } = useStore();
  const { route, tab, profile } = state;
  if (state.viewing) return <PersonProfile />;
  if (tab === "network") return <NetworkScreen />;
  if (tab === "bookings") return <TeamBookings />;
  if (tab === "profile") return <TeamProfile />;
  if (route === "build") return <BuildScreen />;
  if (route === "manual") return <ManualBuild />;
  if (route === "extract") return <ExtractScreen />;
  if (route === "review") return <ReviewScreen />;
  if (route === "phone" && !profile.live) return <PhoneScreen />;
  if (!profile.live) {
    if (route === "phone") return <PhoneScreen />;
    if (route === "tag") return <TagScreen />;
    return <EntryScreen />;
  }
  if (route === "live") return <LiveScreen />;
  return <TeamHome />;
}

function StaffRouter() {
  const { state } = useStore();
  const { route, tab } = state;
  if (state.viewing) return <PersonProfile />;
  if (tab === "network") return <StaffRoster />;
  if (tab === "bookings") return <StaffBookings />;
  if (tab === "profile") return <StaffProfile />;
  if (route === "eventNew") return <EventNew />;
  if (route === "shiftNew") return <ShiftNew />;
  if (route === "shiftSend") return <ShiftSend />;
  return <StaffHome />;
}

/* ==========================================================================
   ROOT — persistence via the `db` capability.
   Each viewer's own state (role, session, profile, connections, invitations,
   events, shifts, engagements, selection) lives under their private
   data/users/{self} subtree, so a reload or a later visit picks up where
   they left off. Demo directory/venues/services stay static — not persisted.
   ========================================================================== */

const PERSIST_KEYS = ["role", "route", "tab", "session", "profile", "connections", "invitations", "reviews", "reviewRequests", "events", "shifts", "engagements", "selection", "categoryVisibility"];

function pickPersisted(state) {
  const out = {};
  PERSIST_KEYS.forEach(k => { out[k] = state[k]; });
  return out;
}

function FireFlair() {
  const [state, baseDispatch] = useReducer(reducer, initialState);
  const dbDocRef = useRef(null);
  const saveTimer = useRef(null);
  const hydratedRef = useRef(false);

  const dispatch = React.useCallback((action) => {
    baseDispatch(action);
  }, []);

  const store = useMemo(() => ({ state, dispatch }), [state, dispatch]);

  // Capture the FireFlair referral tag once, on load.
  useEffect(() => { dispatch({ type: "SESSION", patch: { refTag: "SAM42" } }); }, []);

  // Hydrate from db on mount.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const db = await (window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null));
        if (!db || cancelled) return;
        const ref = db.doc("fireflair/state");
        dbDocRef.current = ref;
        const snap = await ref.get();
        if (!cancelled && snap.exists) {
          const saved = snap.data() || {};
          /* Schema guard: discard a snapshot saved by an earlier build whose
             profile shape this version no longer understands, rather than
             hydrate into a broken state. */
          const stale = saved.profile && (!saved.profile.records || typeof saved.profile.xp === "undefined");
          if (stale) { hydratedRef.current = true; return; }
          const patch = {};
          PERSIST_KEYS.forEach(k => { if (saved[k] !== undefined) patch[k] = saved[k]; });
          if (patch.profile) {
            patch.profile = { ...patch.profile, records: { ...emptyRecords(), ...(patch.profile.records || {}) }, xp: patch.profile.xp || 0, media: patch.profile.media || [] };
            patch.profile = rollXPPeriodIfNeeded(patch.profile);
          }
          if (Object.keys(patch).length) dispatch({ type: "HYDRATE", patch });
        }
      } catch (e) {
        // No db available, or hydration failed — carry on with in-memory state.
      } finally {
        hydratedRef.current = true;
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Debounced save on every change, once hydration has had its chance to run.
  useEffect(() => {
    if (!dbDocRef.current) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      dbDocRef.current.set(pickPersisted(state)).catch(() => {});
    }, 500);
    return () => { if (saveTimer.current) clearTimeout(saveTimer.current); };
  }, [state]);

  return (
    <Store.Provider value={store}>
      <style>{CSS}</style>
      <div className="ff">
        <Shell>{state.viewing ? <PersonProfile /> : state.role === "team" ? <TeamRouter /> : state.role === "staff" ? <StaffRouter /> : <Landing />}</Shell>
      </div>
    </Store.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<FireFlair />);
</script>
