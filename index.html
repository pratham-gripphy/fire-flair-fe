<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fire-flair</title>
    <style>
      /* boot shimmer - shown until React mounts and replaces #root's contents */
      body { margin: 0; background: #F4EFE4; }
      .ff-boot { max-width: 1180px; margin: 0 auto; padding: 78px 16px 0; box-sizing: border-box; }
      .ff-boot i { display: block; position: relative; overflow: hidden; background: rgba(126, 97, 29, .11); border-radius: 2px; margin-bottom: 10px; }
      .ff-boot i::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(100deg, transparent 20%, rgba(255, 251, 238, .75) 50%, transparent 80%); animation: ffboot 1.4s ease-in-out infinite; }
      @keyframes ffboot { to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { .ff-boot i::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ff-boot" role="status" aria-label="Loading">
        <i style="width: 70px; height: 10px"></i>
        <i style="width: min(240px, 60%); height: 26px; margin-bottom: 14px"></i>
        <i style="height: 80px"></i>
        <i style="height: 56px"></i>
        <i style="width: 80%; height: 12px"></i>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
